<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-container">
    <header class="app-header">
      <h1 class="app-title">To-Do List</h1>
      <p class="app-subtitle">Stay organized and get things done</p>
    </header>

    <section class="todo-card">
      <form id="todo-form" class="todo-form" autocomplete="off">
        <input 
          type="text" 
          id="todo-input" 
          class="todo-input" 
          placeholder="What needs to be done?" 
          aria-label="Add a new task"
          required
        >
        <button type="submit" class="btn btn-primary" id="add-btn">
          <span>Add Task</span>
        </button>
      </form>

      <nav class="filters" aria-label="Task filters">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </nav>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <div id="empty-state" class="empty-state hidden">
        <p class="empty-text">No tasks found</p>
      </div>

      <footer class="todo-footer">
        <span id="task-count" class="task-count">0 items left</span>
        <button type="button" id="clear-completed-btn" class="btn-text hidden">Clear completed</button>
      </footer>
    </section>
  </main>
</body>
</html>
